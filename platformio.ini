; All
[env]
monitor_speed = 115200

build_flags =
    -I include
    -D SERIAL_BAUD=${this.monitor_speed}

; ESP32-S3 (R16N8)
[env:esp32-s3-r16n8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

build_flags =
    ${env.build_flags}
    -D ESP32-S3_16-8
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Simulation on Windows
[env:sim_win]
platform = native
build_flags =
    ${env.build_flags}
    -D SIMWIN
    -D SDL_MAIN_HANDLED
    -lSDL2
    ; Or if in other directory:
    ; -L C:/path/to/sdl2/lib -I C:/path/to/sdl2/include

; Simulation on Linux
[env:sim_linux]
platform = native
build_flags =
    ${env.build_flags}
    -D SIMLINUX
    -lSDL2

; Simulation on MacOS
[env:sim_mac]
platform = native
build_flags =
    ${env.build_flags}
    -D SIMMAC
    -lSDL2
    ; Or if you have Homebrew:
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
